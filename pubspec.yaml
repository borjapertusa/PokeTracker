name: pokedex_tracker
description: Tracker de Pokédex con formas, diferencias de género y variocolor.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  objective_c: ^9.6.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sprites/
    - assets/sprites3d/
